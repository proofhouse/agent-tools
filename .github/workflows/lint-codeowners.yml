---
# PR gate that validates `.github/CODEOWNERS` before a broken rule lands
# on main, delegated to the shared reusable workflow in
# proofhouse/github-actions. That workflow checks owners and syntax via
# GitHub's own CODEOWNERS validator and confirms every rule's pattern
# still matches a tracked path, running both checks against this PR's
# tree.
#
# The pull_request trigger lives here because a reusable workflow can't
# carry its own caller-side triggers. The '**' path filter runs the gate
# on every PR, so a deletion anywhere re-triggers the path-existence
# check and the gate can be required without ever skipping.
name: lint-codeowners

on:
  pull_request:
    paths:
      - .github/CODEOWNERS
      - '**'

permissions:
  contents: read

jobs:
  lint-codeowners:
    name: lint-codeowners
    # Pinned reusable-workflow path + 40-char SHA + tag comment overruns
    # yamllint's 120-col limit and can't be wrapped; Renovate keeps the
    # SHA and tag in sync inline.
    # yamllint disable-line rule:line-length
    uses: proofhouse/github-actions/.github/workflows/lint-codeowners.yml@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0
    permissions:
      contents: read
